plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rc.testershot'
    compileSdk 35

    defaultConfig {
        applicationId "com.rc.testershot"
        minSdk 21
        //noinspection ExpiredTargetSdkVersion  -- 29 on purpose: legacy external storage, no FGS-type / trampoline restrictions
        targetSdk 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.1.3'      // newer versions pull in Kotlin
    androidTestImplementation 'androidx.test:runner:1.5.2'   // newer versions pull in Kotlin
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "TesterScreenShot-${variant.name}.apk"
    }
}
